        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: morsel_session
      description: Opaque browser session. Mutations also require exact Origin and session-bound X-CSRF-Token; sensitive changes require passkey verification within twelve hours. Sessions expire after 30 days without sliding renewal and use a persistent cookie.
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AccountItemID:
      name: id
      in: path
      required: true
      description: API key UUID or base64url passkey credential ID.
      schema:
        type: string
        minLength: 1
    ShareCapability:
      name: share
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
  schemas:
    AccountShareStatus:
      type: string
      description: Computed with database time; precedence is revoked, expired, view_limit_exhausted, active.
      enum: [active, revoked, expired, view_limit_exhausted]
    AccountShareMetadata:
      type: object
      required: [id, label, created_at, expires_at, max_views, view_count, revoked_at, status]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 80
          description: Explicit preview title as authored plain text, or the first meaningful Markdown line converted to plain text, or Untitled. Source labels retain inline code and link labels but exclude formatting syntax, link destinations, and authored HTML. Bounded to 80 Unicode characters without changing stored source or public preview metadata.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
          minimum: 1
        view_count:
          type: integer
          format: int64
          minimum: 0
        revoked_at:
          type: [string, "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/AccountShareStatus"
    AccountShareDetail:
      allOf:
        - $ref: "#/components/schemas/AccountShareMetadata"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Stored Markdown, including content no longer available to public readers.
    AccountSharePage:
      type: object
      additionalProperties: false
      required: [items, matching_count]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccountShareMetadata"
        matching_count:
          type: integer
          format: int64
          minimum: 0
          description: Complete number of shares that match q and status before cursor filtering, including zero. Count and items use the same database snapshot and status evaluation time.
        next_cursor:
          type: string
          maxLength: 512
          description: Omitted on the last page.
    AuthenticatedResult:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          enum: [true]
    AccountFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Account-specific error code, such as invalid_origin, invalid_csrf, invalid_flow, invalid_grant, setup_closed, last_passkey, or verification_required.
        message:
          type: string
    AccountState:
      type: object
      required: [setup_required, authenticated]
      properties:
        setup_required:
          type: boolean
        authenticated:
          type: boolean
        csrf_token:
          type: string
          description: Session-bound token, returned only to an authenticated browser.
        verification_required:
          type: boolean
          description: Returned only to an authenticated browser. True when sensitive changes need a new passkey verification; verification remains valid for twelve hours. The server rechecks it on each change.
    EmptyRequest:
      type: object
      additionalProperties: false
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed name limited to 200 UTF-8 bytes by the server.
    GrantFlowRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: Operator-issued token; never place it in a URL.
        name:
          type: string
          maxLength: 200
          description: Trimmed passkey name limited to 200 UTF-8 bytes; defaults to Passkey when omitted.
    WebAuthnOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON. RP ID is hostname-only and user verification is required.
    WebAuthnCredential:
      type: object
      additionalProperties: true
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          additionalProperties: true
      description: Raw browser registration or assertion JSON with base64url binary members. The server validates it with its WebAuthn library and a browser-bound flow cookie.
    APIKey:
      type: object
      required: [id, name, prefix, created_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: Safe display prefix; not a usable API key.
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Secret returned only once. Never cache or persist it in browser storage.
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          description: Base64url credential ID.
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          description: Markdown limited by MORSEL_MAX_DOCUMENT_BYTES, measured in UTF-8 bytes.
        expires_in:
          type: integer
          format: int64
          minimum: 1
          maximum: 315360000
        max_views:
          type: integer
          format: int64
          minimum: 1
        preview:
          $ref: "#/components/schemas/PreviewMetadata"
        telegram_instant_view:
          type: boolean
          default: false
          description: Expose a non-consuming, server-rendered article for Telegram Instant View. Requires preview and cannot be combined with expires_in or max_views because Telegram caches articles independently.
    PreviewMetadata:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Plain-text Open Graph title; surrounding whitespace is trimmed and control or line-separator characters are rejected.
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: Plain-text Open Graph description; surrounding whitespace is trimmed and control or line-separator characters are rejected.
        image:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://"
          description: Optional absolute HTTP(S) URL exposed as og:image; surrounding whitespace is trimmed and URLs containing credentials are rejected.
        locale:
          type: string
          pattern: "^[a-z]{2,3}_[A-Z]{2}$"
          description: Optional Open Graph locale in language_TERRITORY form, such as zh_TW.
    CreateShareResponse:
      type: object
      additionalProperties: false
      required: [id, share_url, created_at, telegram_instant_view]
      properties:
        id:
          type: string
          format: uuid
        share_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
        preview:
          $ref: "#/components/schemas/PreviewMetadata"
        telegram_instant_view:
          type: boolean
    Share:
      type: object
      additionalProperties: false
      required: [content, created_at, view_count]
      properties:
        content:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
        view_count:
          type: integer
          format: int64
          minimum: 1
        views_remaining:
          type: [integer, "null"]
          format: int64
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - content_too_large
            - unauthorized
            - not_found
            - expired
            - revoked
            - view_limit_exhausted
            - internal_error
            - service_unavailable
        message:
          type: string
  responses:
    AccountError:
      description: Invalid request, authentication failure, forbidden origin or CSRF, conflict, rate limit, or unavailable database. Account routes always return Cache-Control no-store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountFailure"
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: API-key authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentTooLarge:
      description: Request or Markdown content exceeded configured limits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Share was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Share is expired, revoked, or exhausted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal dependency or processing failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: PostgreSQL is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
