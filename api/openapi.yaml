openapi: 3.1.0
info:
  title: Morsel API
  version: 1.0.0
  description: API for creating, consuming, and revoking capability-based Markdown shares.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
security: []
servers:
  - url: https://{morselHost}
    variables:
      morselHost:
        default: morsel.your-domain.invalid
        description: Hostname serving both the Morsel viewer and API
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report PostgreSQL readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/shares:
    post:
      operationId: createShare
      summary: Create a Markdown share
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Share created; the raw capability appears only in share_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/shares/{share}:
    get:
      operationId: consumeShare
      summary: Atomically consume one view and retrieve a share
      parameters:
        - $ref: "#/components/parameters/ShareCapability"
      responses:
        "200":
          description: One view was consumed
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: revokeShare
      summary: Idempotently revoke a share
      security:
        - bearerAuth: []
      parameters:
        - name: share
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Share is revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/shares:
    get:
      operationId: listAccountShares
      summary: List all owner shares without consuming views
      description: Includes shares created before account setup and with any API key. Pages are live queries, not a snapshot across requests. View counts and status can change between pages; view-sorted shares can move across the cursor and be skipped or repeated. Restart from the first page to refresh the order. Bearer-only access is rejected. Returns 503 with label_backfill_required while any legacy labels are pending; never returns incomplete search results.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, revoked, expired, view_limit_exhausted]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: q
          in: query
          description: Case-insensitive literal substring of the displayed label. Unicode whitespace is trimmed before the 100 Unicode character limit. Empty input matches all labels. SQL wildcard and escape characters have no special meaning. Repeated parameters return 400.
          schema:
            type: string
        - name: sort
          in: query
          description: newest/oldest order by creation time; most_views/least_views order by view_count. Creation time and UUID break view-count ties in the same direction (descending for newest/most_views, ascending for oldest/least_views).
          schema:
            type: string
            enum: [newest, oldest, most_views, least_views]
            default: newest
        - name: cursor
          in: query
          description: Opaque v2 continuation cursor bound to status, trimmed q fingerprint, and sort. View sorts include a required nonnegative integer view_count key. Existing v2 creation cursors remain valid; v1 cursors are accepted only with empty trimmed q and newest sort. Invalid (including missing or invalid view-sort counts), empty, repeated, or query-mismatched cursors return 400.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Metadata ordered by the selected creation time or view count order, with creation time and UUID ties in the same direction; never contains full content or capability data
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSharePage"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Administrative share UUID, not a reader capability.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAccountShare
      summary: Inspect share content without consuming views
      description: Includes revoked, expired, and exhausted shares. Public capability URLs cannot be recovered.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Administrative metadata and Markdown
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShareDetail"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
    delete:
      operationId: revokeAccountShare
      summary: Revoke a share after fresh verification; requires exact Origin and X-CSRF-Token
      description: Idempotent for existing shares. Revocation is irreversible and does not delete content or external copies. Authorization and revocation commit in one transaction.
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          description: Exact configured application origin.
          schema:
            type: string
      responses:
        "204":
          description: Share is revoked
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/shares/{id}/link:
    parameters:
      - name: id
        in: path
        required: true
        description: Administrative share UUID, not a reader capability.
        schema:
          type: string
          format: uuid
    post:
      operationId: verifyAccountShareLink
      summary: Verify an owner-supplied capability and return its canonical public URL
      description: Requires an owner session, exact Origin, and CSRF. Does not require fresh passkey verification, consume a view, retain the supplied capability, or change share availability. Works for revoked, expired, and exhausted shares without reactivating them. Cannot recover a lost capability.
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          description: Exact configured application origin.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 43
                  maxLength: 43
                  description: Original base64url capability supplied by the owner, never an administrative UUID.
      responses:
        "200":
          description: Canonical public URL for the supplied capability and matching share
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [share_url]
                properties:
                  share_url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account:
    get:
      operationId: getAccount
      summary: Report initial setup and browser session state
      security: []
      responses:
        "200":
          description: Operation result; never cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountState"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/logout:
    post:
      operationId: logoutAccount
      summary: Revoke the current session; requires Origin and X-CSRF-Token
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Operation completed
        "400":
