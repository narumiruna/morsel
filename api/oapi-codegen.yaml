# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
package: api
output: internal/api/openapi.gen.go
generate:
  models: true
  chi-server: true
  strict-server: true
output-options:
  # Account routes are implemented by internal/auth; keep the share client contract separate.
  include-operation-ids:
    - getHealth
    - getReadiness
    - createShare
    - consumeShare
    - revokeShare
  skip-prune: false
