name: morsel

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: morsel
      POSTGRES_USER: morsel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - morsel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morsel -d morsel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ${MORSEL_IMAGE:-narumi/morsel:latest}
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      MORSEL_DATABASE_URL: postgres://morsel:${POSTGRES_PASSWORD}@postgres:5432/morsel?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  morsel:
    image: ${MORSEL_IMAGE:-narumi/morsel:latest}
    environment:
      MORSEL_ENVIRONMENT: ${MORSEL_ENVIRONMENT:-development}
      MORSEL_DATABASE_URL: postgres://morsel:${POSTGRES_PASSWORD}@postgres:5432/morsel?sslmode=disable
      MORSEL_API_KEY: ${MORSEL_API_KEY:?set MORSEL_API_KEY}
      MORSEL_URL: "${MORSEL_URL:-http://localhost:${MORSEL_PORT:-12647}/}"
    ports:
      - "127.0.0.1:${MORSEL_PORT:-12647}:12647"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  morsel-postgres:
