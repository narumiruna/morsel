name: morsel

services:
  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: morsel
      POSTGRES_USER: morsel
      POSTGRES_PASSWORD: ${MORSEL_POSTGRES_PASSWORD:?set MORSEL_POSTGRES_PASSWORD}
    volumes:
      - morsel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morsel -d morsel"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./api
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      MORSEL_DATABASE_URL: postgres://morsel:${MORSEL_POSTGRES_PASSWORD}@postgres:5432/morsel?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      MORSEL_ENVIRONMENT: ${MORSEL_ENVIRONMENT:-development}
      MORSEL_DATABASE_URL: postgres://morsel:${MORSEL_POSTGRES_PASSWORD}@postgres:5432/morsel?sslmode=disable
      MORSEL_API_KEYS: ${MORSEL_API_KEYS:?set MORSEL_API_KEYS}
      MORSEL_ALLOWED_ORIGINS: ${MORSEL_ALLOWED_ORIGINS:-http://localhost:5173}
      MORSEL_PUBLIC_VIEWER_URL: ${MORSEL_PUBLIC_VIEWER_URL:-http://localhost:5173/}
    ports:
      - "127.0.0.1:${MORSEL_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  morsel-postgres:
