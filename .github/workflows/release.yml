name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify latest main
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      # The action checks out its version branch. Tag only the main commit before that.
      - name: Publish repository tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release
      - name: Prepare version PR
        uses: changesets/action@v2
        with:
          version-script: npm run release:version
          push-with-git-cli: true
          commit-message: "chore(release): version repository"
          pr-title: "chore(release): version repository"
          create-github-releases: false
          push-git-tags: false

  container:
    needs: publish
    if: needs.publish.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  release:
    needs: [publish, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --fail-on-no-commits --title "$TAG"
