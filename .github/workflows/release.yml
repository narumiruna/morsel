name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version component to bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify latest main
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Calculate version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_tag="$(git tag --list 'v*' --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"

          if [[ -n "$latest_tag" ]] && ! gh release view "$latest_tag" >/dev/null 2>&1; then
            echo "Recovering unreleased tag $latest_tag"
            echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -n "$latest_tag" ]] && [[ "$(git rev-list -n 1 "$latest_tag")" == "$(git rev-parse HEAD)" ]]; then
            echo "No commits since $latest_tag" >&2
            exit 1
          fi

          version="${latest_tag#v}"
          version="${version:-0.0.0}"
          IFS=. read -r major minor patch <<< "$version"

          case "$BUMP" in
            major) ((major += 1)); minor=0; patch=0 ;;
            minor) ((minor += 1)); patch=0 ;;
            patch) ((patch += 1)) ;;
            *) echo "Unsupported bump: $BUMP" >&2; exit 1 ;;
          esac

          echo "tag=v${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=false" >> "$GITHUB_OUTPUT"
      - name: Tag version
        if: steps.version.outputs.tag_exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" --message "$TAG"
          git push origin "refs/tags/$TAG"

  container:
    needs: tag
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  release:
    needs: [tag, container]
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --fail-on-no-commits --title "$TAG"
