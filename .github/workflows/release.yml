name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Verify latest main
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      # Tag the main commit before preparing version files.
      - name: Publish repository tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release
      - name: Prepare version PR
        id: version
        run: node scripts/prepare-release.mjs
      - name: Create version PR
        if: steps.version.outputs.has-releases == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: changeset-release/main
          base: main
          commit-message: "chore(release): version repository"
          title: "chore(release): version repository"
          body-path: ${{ steps.version.outputs.body-path }}
          add-paths: |
            .changeset/*.md
            CHANGELOG.md
            package.json
            package-lock.json

  container:
    needs: publish
    if: needs.publish.outputs.tag != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/container.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit

  release:
    needs: [publish, container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
        run: gh release create "$TAG" --verify-tag --generate-notes --fail-on-no-commits --title "$TAG"

  deploy:
    needs: [publish, release]
    if: needs.publish.outputs.tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets: inherit
