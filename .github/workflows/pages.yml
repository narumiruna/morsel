name: Viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "viewer/**"
      - "api/openapi.yaml"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "viewer/**"
      - "api/openapi.yaml"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: ${{ vars.MORSEL_API_BASE_URL || 'https://api.morsel.invalid' }}
      VITE_BASE_PATH: /morsel/
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Require the production API origin for deployments
        if: github.event_name != 'pull_request' && vars.MORSEL_API_BASE_URL == ''
        run: |
          echo 'Set the MORSEL_API_BASE_URL repository variable before deploying Pages.' >&2
          exit 1
      - working-directory: viewer
        run: npm ci
      - working-directory: viewer
        run: npm run ci
      - name: Audit production dependencies
        working-directory: viewer
        run: npm audit --omit=dev
      - name: Install Chromium
        working-directory: viewer
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: viewer
        run: npm run test:browser
      - name: Rebuild deploy artifact with production settings
        working-directory: viewer
        run: npm run build
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: viewer/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
