name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      MORSEL_IMAGE: morsel:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag "${MORSEL_IMAGE}" .
      - name: Start services
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MORSEL_API_KEY: ${{ secrets.MORSEL_API_KEY }}
          MORSEL_ENVIRONMENT: ${{ secrets.MORSEL_ENVIRONMENT || 'production' }}
          MORSEL_URL: ${{ secrets.MORSEL_URL }}
          MORSEL_PORT: ${{ secrets.MORSEL_PORT || '12647' }}
        run: |
          : "${MORSEL_URL:?set MORSEL_URL secret}"
          docker compose up --detach --wait --wait-timeout 120
