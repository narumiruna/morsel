name: Deploy

# Verify maintenance prerequisites before publishing, pushing a version tag, or dispatching.
on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to deploy
        required: true
        type: string
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false
      - name: Build image
        run: |
          MORSEL_IMAGE="morsel:$(git rev-parse HEAD)"
          docker build --pull --tag "${MORSEL_IMAGE}" .
          echo "MORSEL_IMAGE=${MORSEL_IMAGE}" >> "$GITHUB_ENV"
      - name: Deploy in verified maintenance window
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MORSEL_ENVIRONMENT: ${{ secrets.MORSEL_ENVIRONMENT || 'production' }}
          MORSEL_URL: ${{ secrets.MORSEL_URL }}
          MORSEL_PORT: ${{ secrets.MORSEL_PORT || '12647' }}
        run: |
          : "${MORSEL_URL:?set MORSEL_URL secret}"
          bash scripts/deploy.sh
