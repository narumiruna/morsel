name: Deploy

# Verify maintenance prerequisites before pushing a version tag or dispatching.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: self-hosted
    env:
      MORSEL_IMAGE: morsel:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag "${MORSEL_IMAGE}" .
      - name: Deploy in verified maintenance window
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          MORSEL_ENVIRONMENT: ${{ secrets.MORSEL_ENVIRONMENT || 'production' }}
          MORSEL_URL: ${{ secrets.MORSEL_URL }}
          MORSEL_PORT: ${{ secrets.MORSEL_PORT || '12647' }}
        run: |
          : "${MORSEL_URL:?set MORSEL_URL secret}"
          bash scripts/deploy.sh
