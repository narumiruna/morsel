name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine3.22
        env:
          POSTGRES_DB: morsel_test
          POSTGRES_USER: morsel
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morsel -d morsel_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MORSEL_TEST_DATABASE_URL: postgres://morsel:test-only-password@127.0.0.1:5432/morsel_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.53.2 lint --config api/redocly.yaml api/openapi.yaml
      - name: Verify generated code
        working-directory: api
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/openapi.gen.go
      - name: Verify formatting and modules
        working-directory: api
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
      - name: Vet
        working-directory: api
        run: go vet ./...
      - name: Vulnerability scan
        working-directory: api
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Test with race detector
        working-directory: api
        run: go test -race -coverprofile=coverage.out ./...
      - name: Repeat final-view concurrency test
        working-directory: api
        run: go test -race -count=10 ./internal/share -run TestPostgresRepositoryConcurrentFinalViews
      - name: Build Morsel image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: morsel:test

  viewer:
    runs-on: ubuntu-latest
    concurrency:
      group: viewer-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - working-directory: viewer
        run: npm ci
      - working-directory: viewer
        run: npm run ci
      - name: Audit production dependencies
        working-directory: viewer
        run: npm audit --omit=dev
      - name: Install Chromium
        working-directory: viewer
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: viewer
        run: npm run test:browser
