openapi: 3.1.0
info:
  title: Morsel API
  version: 1.0.0
  description: |
    API for account-owned Markdown shares and public capability reads.
    Setup creates an admin; migration 12 promotes the oldest existing account by
    created_at, id and assigns user to the rest. All invitations create users.
    Admins can issue browser invitation links; operators can still issue raw tokens.
    Roles never grant access to another account's shares. There is no public account
    enumeration, role selection/editing, or admin invitation.
    Bearer writes use the validated key's account; session management uses the
    authenticated account. Request bodies, queries, and headers cannot select an owner.
    All active keys in one account have the same share permissions.
    Public capability reads, previews, and Instant View remain available to anyone
    with a valid capability, including users signed in to another account.
    Public responses contain no account IDs or display names.
    Successful authenticated browser management and bound authentication responses
    carry the server-derived X-Morsel-Account-ID response marker. Unauthenticated
    account state and errors need not carry it. Bearer share-write responses and
    public capability responses do not include this browser identity marker.
    This marker never selects ownership. Private clients must discard responses
    with missing or mismatched markers, refresh account identity, and not replay mutations.
    Account/authentication routes use Cache-Control no-store. Authentication POSTs
    require the exact configured Origin; session-bound mutations also require
    X-CSRF-Token. Ceremonies are browser-bound, single-use, and expire after 10 minutes.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
security: []
servers:
  - url: https://{morselHost}
    variables:
      morselHost:
        default: morsel.your-domain.invalid
        description: Hostname serving both the Morsel viewer and API
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report PostgreSQL readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/shares:
    post:
      operationId: createShare
      summary: Create a Markdown share owned by the validated key's account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Share created; the raw capability appears only in share_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/shares/{share}:
    get:
      operationId: consumeShare
      summary: Atomically consume one view and retrieve a share
      parameters:
        - $ref: "#/components/parameters/ShareCapability"
      responses:
        "200":
          description: One view was consumed
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: revokeShare
      summary: Idempotently revoke an owned share
      description: Any active key in the owning account can revoke it. Foreign and missing UUIDs return identical 404 not_found errors. Repeated revocation of an owned share succeeds.
      security:
        - bearerAuth: []
      parameters:
        - name: share
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Share is revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/shares:
    get:
      operationId: listAccountShares
      summary: List the authenticated account's shares without consuming views
      description: Includes only shares owned by the authenticated account, including those created by any of its keys. Ownership applies before search, status, matching_count, cursor filtering, ordering, and limits. Pages are live queries, not a snapshot across requests. View counts and status can change between pages; view-sorted shares can move across the cursor and be skipped or repeated. Restart from the first page to refresh the order. Bearer-only access is rejected. Returns 503 with label_backfill_required while any labels in this account are pending, including zero-match searches; never returns incomplete search results.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, revoked, expired, view_limit_exhausted]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: q
          in: query
          description: Case-insensitive literal substring of the displayed label. Unicode whitespace is trimmed before the 100 Unicode character limit. Empty input matches all labels. SQL wildcard and escape characters have no special meaning. Repeated parameters return 400.
          schema:
            type: string
        - name: sort
          in: query
          description: newest/oldest order by creation time; most_views/least_views order by view_count. Creation time and UUID break view-count ties in the same direction (descending for newest/most_views, ascending for oldest/least_views).
          schema:
            type: string
            enum: [newest, oldest, most_views, least_views]
            default: newest
        - name: cursor
          in: query
          description: Opaque v3 continuation cursor bound to the authenticated account, status, trimmed q fingerprint, and sort. View sorts include a required nonnegative integer view_count key. Old unbound v1/v2 cursors, foreign-account cursors, invalid counts, empty, repeated, or query-mismatched cursors return 400. Restart at page one. SQL enforces ownership independently of cursor contents.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Metadata ordered by the selected creation time or view count order, with creation time and UUID ties in the same direction; never contains full content or capability data
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSharePage"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Administrative share UUID, not a reader capability.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAccountShare
      summary: Inspect share content without consuming views
      description: Includes only owned shares, even if revoked, expired, or exhausted. Foreign and missing UUIDs return identical 404 not_found errors before label readiness is checked. link_available indicates whether the original capability was retained for owning-account retrieval.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Administrative metadata and Markdown
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShareDetail"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
    delete:
      operationId: revokeAccountShare
      summary: Revoke a share after fresh verification; requires exact Origin and X-CSRF-Token
      description: Idempotent for owned shares. Foreign and missing UUIDs return identical 404 not_found errors. Revocation is irreversible and does not delete content or external copies. Authorization and revocation commit in one transaction.
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          description: Exact configured application origin.
          schema:
            type: string
      responses:
        "204":
          description: Share is revoked
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/shares/{id}/link:
    parameters:
      - name: id
        in: path
        required: true
        description: Administrative share UUID, not a reader capability.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAccountShareLink
      summary: Retrieve the stored public URL without consuming a view
      description: Requires the owning account's browser session. Returns the canonical URL for active, revoked, expired, and exhausted shares without changing availability. Owned legacy shares without a retained plaintext capability return 404 link_unavailable; foreign and missing shares return identical 404 not_found errors. Invalid stored tokens or hash mismatches fail closed with a generic 503. Does not require fresh passkey verification.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Stored canonical public URL
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [share_url]
                properties:
                  share_url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
    post:
      operationId: verifyAccountShareLink
      summary: Verify an owner-supplied capability and return its canonical public URL
      description: Requires the owning account's session, exact Origin, and CSRF. Foreign and missing UUIDs return identical 404 not_found errors. Does not require fresh passkey verification, consume a view, retain the supplied capability, or change share availability. Works for revoked, expired, and exhausted shares without reactivating them. Cannot recover a lost capability.
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          description: Exact configured application origin.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  minLength: 43
                  maxLength: 43
                  description: Original base64url capability supplied by the owner, never an administrative UUID.
      responses:
        "200":
          description: Canonical public URL for the supplied capability and matching share
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [share_url]
                properties:
                  share_url:
                    type: string
                    format: uri
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/invitations:
    post:
      operationId: createAccountInvitation
      summary: Create a one-use invitation link as an admin browser
      description: |
        Manual handler, excluded from generated share operations. Requires a browser
        session, exact configured Origin, valid CSRF, passkey verification within
        twelve hours, and the current database role admin. Authorization, role check,
        and grant insertion occur in one transaction. API keys alone, including
        admin-owned keys, cannot authorize this operation. All query parameters are
        rejected. The body must be exactly an empty JSON object; unknown fields,
        role/owner selectors, null, and trailing JSON are rejected.
        Returns the secret link once, derived only from the configured origin as
        /invite#token=<43-character base64url token>, never from Host or forwarded
        headers. Only the grant hash is stored. The database sets the one-hour
        expiry. Grants are independent and usable once; logout or recovery of the
        issuer does not revoke them. No listing or revocation is available.
        Admins manually share this forwardable bearer link; no SMTP, email binding,
        or person verification is provided. Opening /invite or fetching a preview
        does not consume a grant. Registration requires explicit passkey submission.
        Never log or persist the link in browser storage. Do not automatically
        replay failed or uncertain requests; an explicit retry creates a new grant.
        Existing request-size limits and a fixed invitation-issuance limiter apply.
        Rate-limited attempts insert no grant and return Retry-After.
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          description: Exact configured application origin.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "201":
          description: Independent invitation created; secret link returned once
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          description: Valid browser session required; API keys alone cannot invite
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFailure"
        "403":
          description: Current database role is not admin, Origin/CSRF is invalid, or fresh verification is required
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFailure"
        "429":
          description: Invitation issuance rate limit exceeded; no grant inserted
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              description: Seconds before retry is permitted. Retry must be explicit.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountFailure"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account:
    get:
      operationId: getAccount
      summary: Report initial setup and browser session state
      security: []
      responses:
        "200":
          description: Operation result; never cache
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountState"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/logout:
    post:
      operationId: logoutAccount
      summary: Revoke the current session; requires Origin and X-CSRF-Token
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Operation completed
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/setup/begin:
    post:
      operationId: beginSetup
      summary: Begin setup with exact Origin and a browser-bound flow cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupFlowRequest"
      responses:
        "200":
          description: Operation result; never cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/setup/finish:
    post:
      operationId: finishSetup
      summary: Complete the single-use setup flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Flow completed
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedResult"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/invite/begin:
    post:
      operationId: beginInvite
      summary: Begin invited account registration
      description: Requires exact Origin and a one-use admin or operator invitation, valid for one hour. Independent invitations do not cancel one another. Creates only a user; display_name and passkey name are separate and cannot select a role. The viewer can ingest an invitation-only /invite#token=<43-character base64url token> fragment, immediately replace the current history entry with clean /invite, and submit the token only in this POST body. No secret query/path or token-bearing GET endpoint is supported. Setup and recovery tokens remain form-only. A valid signed-in browser session returns 409 sign_out_required without consuming the grant or replacing its session. Expired/invalid cookies may proceed; database errors fail closed. The recipient must log out or use a private window and reopen the original link. Merely opening a link does not consume it.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteFlowRequest"
      responses:
        "200":
          description: Operation result; never cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/invite/finish:
    post:
      operationId: finishInvite
      summary: Complete invitation registration and create a user, first passkey, and session atomically
      description: Rechecks that the browser has no valid signed-in session. A valid session returns 409 sign_out_required without consuming the grant or overwriting the session, including when login occurs after begin. Expired/invalid cookies may proceed; database errors fail closed. Expired, used, invalid, or concurrently redeemed grants cannot create accounts and use the generic invalid_grant failure. A cancelled ceremony does not consume the grant. Clients cannot select a role.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Flow completed
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedResult"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/login/begin:
    post:
      operationId: beginLogin
      summary: Begin discoverable login without selecting an account
      description: No account or credential enumeration. The assertion credential ID and user handle must identify the same registered account; unknown and mismatched pairs use the same public failure. A credential added after this flow began requires a new flow.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyRequest"
      responses:
        "200":
          description: Operation result; never cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/login/finish:
    post:
      operationId: finishLogin
      summary: Complete the single-use login flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Flow completed
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedResult"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/recover/begin:
    post:
      operationId: beginRecover
      summary: Begin recovery for the account bound to the operator grant
      description: The operator issues recovery with an explicit account UUID. The browser cannot select the account or role. Replaces only that account's credentials and sessions on completion; API keys, share ownership, and account role are preserved. Other accounts are unaffected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantFlowRequest"
      responses:
        "200":
          description: Operation result; never cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnOptions"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/auth/recover/finish:
    post:
      operationId: finishRecover
      summary: Complete the single-use recover flow
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredential"
      responses:
        "200":
          description: Flow completed
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticatedResult"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
