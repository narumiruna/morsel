openapi: 3.1.0
info:
  title: Morsel API
  version: 1.0.0
  description: |
    API for account-owned Markdown shares and public capability reads.
    Setup creates an admin; migration 12 promotes the oldest existing account by
    created_at, id and assigns user to the rest. All invitations create users.
    Admins can issue browser invitation links; operators can still issue raw tokens.
    Roles never grant access to another account's shares. There is no public account
    enumeration, role selection/editing, or admin invitation.
    Bearer writes use the validated key's account; session management uses the
    authenticated account. Request bodies, queries, and headers cannot select an owner.
    All active keys in one account have the same share permissions.
    Public capability reads, previews, and Instant View remain available to anyone
    with a valid capability, including users signed in to another account.
    Public responses contain no account IDs or display names.
    Successful authenticated browser management and bound authentication responses
    carry the server-derived X-Morsel-Account-ID response marker. Unauthenticated
    account state and errors need not carry it. Bearer share-write responses and
    public capability responses do not include this browser identity marker.
    This marker never selects ownership. Private clients must discard responses
    with missing or mismatched markers, refresh account identity, and not replay mutations.
    Account/authentication routes use Cache-Control no-store. Authentication POSTs
    require the exact configured Origin; session-bound mutations also require
    X-CSRF-Token. Ceremonies are browser-bound, single-use, and expire after 10 minutes.
    Native MCP OAuth runs in the same Go process with Fosite v0.49.0 and PostgreSQL.
    OAuth protocol/metadata routes below are manual handlers with security: [];
    cookies add no protocol authority. Browser consent/grant routes instead require
    browserCookieAuth and account response markers. These routes do not expand
    generated health/share REST bindings or define MCP tool schemas.
    OAuth authorizes only /mcp, never REST writes or account management. API keys
    keep existing REST/MCP permissions, non-expiring lifetime until revocation,
    and recovery behavior. Issuer is the canonical MORSEL_URL origin and resource
    is <origin>/mcp, never Host/forwarded headers. MCP 401 challenges include
    resource_metadata and mcp:shares offline_access; otherwise valid tokens with
    insufficient scope receive 403 insufficient_scope. Only native/public DCR,
    authorization code, S256 PKCE, and rotating refresh are supported. CIMD is
    deliberately omitted despite the MCP recommendation to avoid client-controlled
    metadata fetching/SSRF. No outbound client URL fetch occurs.
  license:
    name: GNU Affero General Public License v3.0 only
    identifier: AGPL-3.0-only
security: []
servers:
  - url: https://{morselHost}
    variables:
      morselHost:
        default: morsel.your-domain.invalid
        description: Hostname serving both the Morsel viewer and API
paths:
  /.well-known/oauth-protected-resource/mcp:
    get:
      operationId: getMCPResourceMetadata
      summary: Discover the canonical MCP resource and authorization server
      description: Public RFC 9728 metadata. No query parameters. Credential-free GET/OPTIONS CORS only, not application-wide CORS.
      security: []
      responses:
        "200":
          description: Configured resource metadata; never cache
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/PublicMetadataOrigin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthResourceMetadata"
        "400":
          $ref: "#/components/responses/OAuthProtocolError"
        "405":
          $ref: "#/components/responses/OAuthMethodNotAllowed"
    options:
      operationId: optionsMCPResourceMetadata
      summary: Report credential-free resource metadata CORS
      security: []
      responses:
        "204":
          $ref: "#/components/responses/OAuthMetadataOptions"
  /.well-known/oauth-authorization-server:
    get:
      operationId: getOAuthAuthorizationServerMetadata
      summary: Discover the native authorization server
      description: Public RFC 8414 metadata derived from MORSEL_URL, with RFC 9207 issuer identification. No query parameters, CIMD, JWTs, or client secrets.
      security: []
      responses:
        "200":
          description: Configured authorization metadata; never cache
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Access-Control-Allow-Origin:
              $ref: "#/components/headers/PublicMetadataOrigin"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthServerMetadata"
        "400":
          $ref: "#/components/responses/OAuthProtocolError"
        "405":
          $ref: "#/components/responses/OAuthMethodNotAllowed"
    options:
      operationId: optionsOAuthAuthorizationServerMetadata
      summary: Report credential-free authorization metadata CORS
      security: []
      responses:
        "204":
          $ref: "#/components/responses/OAuthMetadataOptions"
  /oauth/register:
    post:
      operationId: registerOAuthClient
      summary: Register an unverified public native client
      description: |
        Manual DCR handler. JSON only; optional charset must be UTF-8. Rejects
        Authorization headers, query parameters, unknown/duplicate members, nulls,
        and trailing JSON. Cookies add no authority. Native Origin may be omitted;
        a supplied Origin must be the single exact configured origin. No client
        metadata URL, logo, or callback is fetched. Redirects match exactly except
        an HTTP IP-literal loopback port change; localhost and HTTPS match exactly.
        Userinfo, wildcards, queries, fragments, escaped paths, and prefixes are
        rejected. Registration expires after 90 days, extended by valid authorize/
        token traffic. All retained clients count toward the 10000-client cap.
        Protocol input is at most 16 KiB. The separate per-process OAuth limiter
        allows 60/source-IP/fixed-endpoint-kind/minute and 1000 globally/minute;
        forwarded IP headers are not trusted. Rate/capacity failures insert no client.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthRegistrationRequest"
      responses:
        "201":
          description: Public native client registered; no secret or registration-management token
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthRegisteredClient"
        "400":
          $ref: "#/components/responses/OAuthProtocolError"
        "403":
          $ref: "#/components/responses/OAuthProtocolError"
        "405":
          $ref: "#/components/responses/OAuthMethodNotAllowed"
        "429":
          $ref: "#/components/responses/OAuthRateLimited"
        "503":
          $ref: "#/components/responses/OAuthProtocolError"
  /oauth/authorize:
    get:
      operationId: beginOAuthAuthorization
      summary: Validate authorization and open internal consent
      description: |
        Manual native code handler. Creates a ten-minute pending request, not a
        grant/code. Client and redirect are validated before any redirect, including
        errors. Invalid input returns local JSON. No GET, preview, or login alone
        issues credentials. Parameters are single-valued, at most 2048 UTF-8 bytes
        each without NUL/CR/LF, at most 16 KiB total; unknown/duplicate fields fail.
        S256 and the exact configured resource are mandatory. Scope is mcp:shares,
        optionally offline_access for refresh. All 10000 retained pending requests
        count toward admission. Consent read binds account/generation/exact session.
      security: []
      parameters:
        - name: response_type
          in: query
          required: true
          schema:
            type: string
            const: code
        - name: client_id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OAuthClientID"
        - name: redirect_uri
          in: query
          required: true
          description: Registered callback with only the IP-loopback port exception; exchange must use this exact authorized value.
          schema:
            $ref: "#/components/schemas/OAuthRedirectURI"
        - name: state
          in: query
          required: true
          description: Preserved exactly in callback; bounded to 8–2048 UTF-8 bytes (byte length, not character count).
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: code_challenge
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
        - name: code_challenge_method
          in: query
          required: true
          schema:
            type: string
            const: S256
        - name: resource
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OAuthResource"
        - name: scope
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/OAuthRequestedScope"
        - name: prompt
          in: query
          schema:
            type: string
            enum: [consent]
      responses:
        "302":
          description: Configured-origin SPA consent page; no code issued
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              description: Only /oauth/consent?request=<43-character opaque handle> at the configured origin, not an arbitrary next URL.
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/OAuthProtocolError"
        "403":
          $ref: "#/components/responses/OAuthProtocolError"
        "405":
          $ref: "#/components/responses/OAuthMethodNotAllowed"
        "429":
          $ref: "#/components/responses/OAuthRateLimited"
        "503":
          $ref: "#/components/responses/OAuthProtocolError"
  /oauth/token:
    post:
      operationId: exchangeOAuthToken
      summary: Atomically exchange a code or rotate a refresh token
      description: |
        Manual public-client handler, token_endpoint_auth_method=none. Form body
        only (optional UTF-8 charset), no Authorization header/query parameters,
        no duplicate/unknown fields. Cookies add no authority. Native Origin may
        be absent; if supplied it must match exactly. Client ID and configured
        resource are mandatory for both grants. Code exchange needs the exact
        authorized redirect and S256 verifier. Optional scope must normalize to
        the original family scope (order normalized); narrowing and widening both
        return invalid_scope. No downscoping is implemented; reauthorize without
        offline_access for no refresh. Pi/configured Go omit scope on refresh. Codes last
        one minute; access tokens at most ten minutes. Offline-access families
        expire 30 days after approval; access-only families expire ten minutes
        after approval. Rotation never extends the deadline and invalidates old
        access credentials. Code/refresh reuse revokes the family including access.
        Concurrent redemption can revoke the winning pair. Lost responses are
        uncertain; never automatically retry redemption. PostgreSQL persists state.
        Go MCP SDK v1.8.0 default oauth2.Config.TokenSource omits resource on refresh
        and receives 400; use an explicit resource-aware refresh transport/hook.
        Input is at most 16 KiB, each value at most 2048 UTF-8 bytes. Families retain
        at most 10000 token rows including tombstones. At capacity, wait for eligible
        expiry/cleanup then explicitly reauthorize; no automatic retry loop.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              oneOf:
                - $ref: "#/components/schemas/OAuthCodeExchange"
                - $ref: "#/components/schemas/OAuthRefreshExchange"
      responses:
        "200":
          description: Committed access token and optional newly rotated refresh token; secret response
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              schema:
                type: string
                const: no-cache
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
        "400":
          $ref: "#/components/responses/OAuthProtocolError"
        "403":
          $ref: "#/components/responses/OAuthProtocolError"
        "405":
          $ref: "#/components/responses/OAuthMethodNotAllowed"
        "429":
          $ref: "#/components/responses/OAuthRateLimited"
        "503":
          $ref: "#/components/responses/OAuthProtocolError"
  /oauth/revoke:
    post:
      operationId: revokeOAuthToken
      summary: Revoke a token's client-bound grant family
      description: |
        Manual RFC 7009 handler. Form client_id and token required; no Authorization
        header/query parameters. Cookies add no authority. Same strict Origin/form/
        field/input limits as token exchange. Access or refresh credentials revoke
        only the matching client's family. Hint does not override actual token type.
        Unknown, malformed, foreign-client, expired, or revoked credentials return
        the same empty 200 object. Keys, shares, and other families are unchanged.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/OAuthRevocationRequest"
      responses:
        "200":
          description: Family revoked or credential not recognized; indistinguishable
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmptyRequest"
        "400":
          $ref: "#/components/responses/OAuthProtocolError"
        "403":
          $ref: "#/components/responses/OAuthProtocolError"
        "405":
          $ref: "#/components/responses/OAuthMethodNotAllowed"
        "429":
          $ref: "#/components/responses/OAuthRateLimited"
        "503":
          $ref: "#/components/responses/OAuthProtocolError"
  /v1/account/oauth/requests/{request}:
    parameters:
      - name: request
        in: path
        required: true
        description: Pending opaque handle, not a code/token or arbitrary next destination; only its hash is stored.
        schema:
          type: string
          pattern: "^[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
    get:
      operationId: getOAuthConsent
      summary: Bind and inspect consent for this browser account/session
      description: |
        Manual browser route, no query parameters. Requires a session, not API-key/
        OAuth Bearer access. First read binds the ten-minute request to this account,
        generation, and exact session, without issuing a grant/code. A new session
        for the same account must restart; logout, recovery, switching accounts,
        and expiry cannot rebind it. Viewer shows account/name/UUID, unverified app
        name/client ID, redirect host, resource, scope, permissions, persistent access.
      security:
        - browserCookieAuth: []
      responses:
        "200":
          description: Account/session-bound display data; no credential, verifier, or client state
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthConsent"
        "401":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
    post:
      operationId: decideOAuthConsent
      summary: Approve or deny only the displayed account's bound request
      description: |
        Manual browser mutation. Requires exact Origin, CSRF, and a prior consent
        read by the same account/generation/session. account_id confirms displayed
        identity, never selects ownership. Approval requires passkey verification
        within twelve hours; denial does not. Strict JSON: no nulls, unknown/duplicate
        members, trailing data, or query parameters; browser body limit 64 KiB.
        Approval/code creation commits atomically under account/request locks.
        Duplicate decisions fail. Denial issues no grant/code. Callback includes
        state, iss, and code or error=access_denied at the validated redirect. Never
        log/cache/store it or automatically replay failed/uncertain decisions.
        Admission counts all retained grants: 10000 global, 100 per account.
        Revocation does not immediately free a retained slot. Logout invalidates
        pending consent, not existing grants/API keys. Recovery invalidates older
        OAuth codes/grants/tokens through generation checks, not API keys.
      security:
        - browserCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/BrowserOrigin"
        - $ref: "#/components/parameters/BrowserCSRF"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthConsentDecision"
      responses:
        "200":
          description: One-use decision committed; navigate only while account marker is current
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthConsentResult"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/oauth/grants:
    get:
      operationId: listOAuthGrants
      summary: List only the browser account's connected-app families
      description: Manual session-only route; no query parameters. Returns retained active/expired/revoked families newest first with UUID tie order. No signatures/tokens. Recovery makes older-generation families unusable and reports them as revoked. API-key/OAuth Bearer credentials alone cannot list grants.
      security:
        - browserCookieAuth: []
      responses:
        "200":
          description: Owned metadata including unverified names and distinguishing IDs
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                type: array
                maxItems: 100
                items:
                  $ref: "#/components/schemas/OAuthGrant"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/oauth/grants/{id}:
    delete:
      operationId: revokeOAuthGrant
      summary: Revoke one owned connected-app family after fresh verification
      description: Manual browser-only route; exact Origin, CSRF, and twelve-hour verification freshness rechecked under account lock through commit. No query parameters. Foreign/missing UUIDs return identical 404 not_found; repeated owned revocation succeeds. Stops subsequent OAuth requests, not already-authorized operations. Keys, shares, other families remain unchanged; grant row is retained. No automatic retries.
      security:
        - browserCookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            minLength: 36
            maxLength: 36
        - $ref: "#/components/parameters/BrowserOrigin"
        - $ref: "#/components/parameters/BrowserCSRF"
      responses:
        "204":
          description: Owned family revoked; no body
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /healthz:
    get:
      operationId: getHealth
      summary: Report process liveness
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report PostgreSQL readiness
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /v1/shares:
    post:
      operationId: createShare
      summary: Create a Markdown share owned by the validated key's account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShareRequest"
      responses:
        "201":
          description: Share created; the raw capability appears only in share_url
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateShareResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          $ref: "#/components/responses/ContentTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/shares/{share}:
    get:
      operationId: consumeShare
      summary: Atomically consume one view and retrieve a share
      parameters:
        - $ref: "#/components/parameters/ShareCapability"
      responses:
        "200":
          description: One view was consumed
          headers:
            Cache-Control:
              schema:
                type: string
              description: Always no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Share"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: revokeShare
      summary: Idempotently revoke an owned share
      description: Any active key in the owning account can revoke it. Foreign and missing UUIDs return identical 404 not_found errors. Repeated revocation of an owned share succeeds.
      security:
        - bearerAuth: []
      parameters:
        - name: share
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Share is revoked
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /v1/account/shares:
    get:
      operationId: listAccountShares
      summary: List the authenticated account's shares without consuming views
      description: Includes only shares owned by the authenticated account, including those created by any of its keys. Ownership applies before search, status, matching_count, cursor filtering, ordering, and limits. Pages are live queries, not a snapshot across requests. View counts and status can change between pages; view-sorted shares can move across the cursor and be skipped or repeated. Restart from the first page to refresh the order. Bearer-only access is rejected. Returns 503 with label_backfill_required while any labels in this account are pending, including zero-match searches; never returns incomplete search results.
      security:
        - sessionCookie: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, revoked, expired, view_limit_exhausted]
            default: all
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: q
          in: query
          description: Case-insensitive literal substring of the displayed label. Unicode whitespace is trimmed before the 100 Unicode character limit. Empty input matches all labels. SQL wildcard and escape characters have no special meaning. Repeated parameters return 400.
          schema:
            type: string
        - name: sort
          in: query
          description: newest/oldest order by creation time; most_views/least_views order by view_count. Creation time and UUID break view-count ties in the same direction (descending for newest/most_views, ascending for oldest/least_views).
          schema:
            type: string
            enum: [newest, oldest, most_views, least_views]
            default: newest
        - name: cursor
          in: query
          description: Opaque v3 continuation cursor bound to the authenticated account, status, trimmed q fingerprint, and sort. View sorts include a required nonnegative integer view_count key. Old unbound v1/v2 cursors, foreign-account cursors, invalid counts, empty, repeated, or query-mismatched cursors return 400. Restart at page one. SQL enforces ownership independently of cursor contents.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        "200":
          description: Metadata ordered by the selected creation time or view count order, with creation time and UUID ties in the same direction; never contains full content or capability data
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSharePage"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
  /v1/account/shares/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Administrative share UUID, not a reader capability.
        schema:
          type: string
          format: uuid
    get:
      operationId: getAccountShare
      summary: Inspect share content without consuming views
      description: Includes only owned shares, even if revoked, expired, or exhausted. Foreign and missing UUIDs return identical 404 not_found errors before label readiness is checked. link_available indicates whether the original capability was retained for owning-account retrieval.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Administrative metadata and Markdown
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountShareDetail"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "404":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
    delete:
      operationId: revokeAccountShare
      summary: Revoke a share after fresh verification; requires exact Origin and X-CSRF-Token
      description: Idempotent for owned shares. Foreign and missing UUIDs return identical 404 not_found errors. Revocation is irreversible and does not delete content or external copies. Authorization and revocation commit in one transaction.
      security:
        - sessionCookie: []
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema:
            type: string
        - name: Origin
          in: header
          required: true
          description: Exact configured application origin.
          schema:
            type: string
      responses:
        "204":
          description: Share is revoked
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
            Cache-Control:
              schema:
                type: string
                const: no-store
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
