          description: Operation completed
          headers:
            X-Morsel-Account-ID:
              $ref: "#/components/headers/AccountIdentity"
        "400":
          $ref: "#/components/responses/AccountError"
        "401":
          $ref: "#/components/responses/AccountError"
        "403":
          $ref: "#/components/responses/AccountError"
        "409":
          $ref: "#/components/responses/AccountError"
        "429":
          $ref: "#/components/responses/AccountError"
        "503":
          $ref: "#/components/responses/AccountError"
components:
  headers:
    AccountIdentity:
      description: Server-derived UUID of the browser account authorized for this response. Never a request selector. Present on successful authenticated browser management and bound authentication responses; omitted for unauthenticated account state. Errors need not carry it. Compare with both expected and current identity before using private data; discard mismatches and refresh identity without replaying mutations.
      schema:
        type: string
        format: uuid
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: morsel_session
      description: Opaque browser session. Mutations also require exact Origin and session-bound X-CSRF-Token; sensitive changes require passkey verification within twelve hours. Sessions expire after 30 days without sliding renewal and use a persistent cookie.
    bearerAuth:
      type: http
      scheme: bearer
      description: Active account-issued key. Ownership comes only from its validated account, not request input. All keys in the same account have the same share permissions; they cannot manage another account's shares.
  parameters:
    AccountItemID:
      name: id
      in: path
      required: true
      description: API key UUID or base64url passkey credential ID.
      schema:
        type: string
        minLength: 1
    ShareCapability:
      name: share
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
  schemas:
    AccountShareStatus:
      type: string
      description: Computed with database time; precedence is revoked, expired, view_limit_exhausted, active.
      enum: [active, revoked, expired, view_limit_exhausted]
    AccountShareMetadata:
      type: object
      required: [id, label, created_at, expires_at, max_views, view_count, revoked_at, status, link_available]
      properties:
        link_available:
          type: boolean
          description: Whether the original capability token is stored for owner retrieval. False when no plaintext token is retained; does not indicate public availability.
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 80
          description: Explicit preview title as authored plain text, or the first meaningful Markdown line converted to plain text, or Untitled. Source labels retain inline code and link labels but exclude formatting syntax, link destinations, and authored HTML. Bounded to 80 Unicode characters without changing stored source or public preview metadata.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
          minimum: 1
        view_count:
          type: integer
          format: int64
          minimum: 0
        revoked_at:
          type: [string, "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/AccountShareStatus"
    AccountShareDetail:
      allOf:
        - $ref: "#/components/schemas/AccountShareMetadata"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Stored Markdown, including content no longer available to public readers.
    AccountSharePage:
      type: object
      additionalProperties: false
      required: [items, matching_count]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccountShareMetadata"
        matching_count:
          type: integer
          format: int64
          minimum: 0
          description: Complete number of this account's shares that match q and status before cursor filtering, including zero. Count and items use the same database snapshot and status evaluation time.
        next_cursor:
          type: string
          maxLength: 512
          description: Account-bound version 3 cursor; omitted on the last page.
    AuthenticatedResult:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          enum: [true]
    AccountFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Account-specific error code, such as invalid_origin, invalid_csrf, invalid_flow, invalid_grant, sign_out_required, setup_closed, last_passkey, or verification_required. Invitation begin and finish return 409 sign_out_required for a valid signed-in browser session without consuming the grant or overwriting the session.
        message:
          type: string
    AccountState:
      type: object
      description: account_id, display_name, role, csrf_token, and verification_required are returned only when authenticated is true. Role is loaded from the database, not client input or session claims; it never grants cross-account share access. No account enumeration is provided.
      required: [setup_required, authenticated]
      properties:
        setup_required:
          type: boolean
        authenticated:
          type: boolean
        account_id:
          type: string
          format: uuid
          description: Stable authenticated account identity; never an owner request selector.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Authenticated account display name, bounded to 200 UTF-8 bytes. Need not be unique and does not authorize requests.
        role:
          type: string
          enum: [admin, user]
          description: Current database role, returned only when authenticated. Only admin can create browser invitations. Neither role can manage another account's shares.
        csrf_token:
          type: string
          description: Session-bound token, returned only to an authenticated browser.
        verification_required:
          type: boolean
          description: Returned only to an authenticated browser. True when sensitive changes need a new passkey verification; verification remains valid for twelve hours. The server rechecks it on each change.
      allOf:
        - if:
            properties:
              authenticated:
                const: true
            required: [authenticated]
          then:
            properties:
              role:
                type: string
                enum: [admin, user]
            required: [role]
          else:
            not:
              properties:
                role:
                  type: string
              required: [role]
    CreatedInvitation:
      type: object
      additionalProperties: false
      required: [invitation_url, expires_at]
      properties:
        invitation_url:
          type: string
          format: uri
          pattern: "^https?://[^/?#]+/invite#token=[A-Za-z0-9_-]{43}$"
          description: Configured-origin fragment URL returned once; a forwardable bearer secret, never a query/path token. Keep out of logs and browser storage.
        expires_at:
          type: string
          format: date-time
          description: Database-derived expiry, one hour after issuance.
    EmptyRequest:
      type: object
      additionalProperties: false
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed name limited to 200 UTF-8 bytes by the server.
    SetupFlowRequest:
      allOf:
        - $ref: "#/components/schemas/GrantFlowRequest"
      description: Setup only when no account exists; creates an admin explicitly. Optional display_name defaults to Owner; name labels the passkey. Clients cannot select a role. Setup tokens remain form-only, never in URLs.
    InviteFlowRequest:
      allOf:
        - $ref: "#/components/schemas/GrantFlowRequest"
        - type: object
          required: [display_name]
      description: A one-use admin or operator invitation always creates a user. display_name names the account; name labels its first passkey. Neither selects an existing account or role.
    GrantFlowRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: One-use grant token submitted only in this POST body. Setup and recovery tokens must never appear in URLs. Only invitation tokens may arrive in the viewer's /invite#token=<token> fragment; the viewer removes the fragment before navigation and keeps the token only in flow memory. Never put grant secrets in query parameters, paths, logs, or browser storage.
        name:
          type: string
          maxLength: 200
          description: Trimmed passkey name limited to 200 UTF-8 bytes; defaults to Passkey when omitted.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Separate account display name, trimmed and bounded to 200 UTF-8 bytes. Required for invitation registration; setup defaults to Owner when omitted. Recovery retains the grant-bound account's existing name. Names need not be unique and never authorize requests.
    WebAuthnOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON. RP ID is hostname-only and user verification is required.
    WebAuthnCredential:
      type: object
      additionalProperties: true
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          additionalProperties: true
      description: Raw browser registration or assertion JSON with base64url binary members. The server validates it with its WebAuthn library and a browser-bound flow cookie.
    APIKey:
      type: object
      required: [id, name, prefix, created_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: Safe display prefix; not a usable API key.
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Secret returned only once. Never cache or persist it in browser storage.
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          description: Base64url credential ID.
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          description: Markdown limited by MORSEL_MAX_DOCUMENT_BYTES, measured in UTF-8 bytes.
        expires_in:
          type: integer
          format: int64
          minimum: 1
          maximum: 315360000
        max_views:
          type: integer
          format: int64
          minimum: 1
        preview:
          $ref: "#/components/schemas/PreviewMetadata"
        telegram_instant_view:
          type: boolean
          default: false
          description: Expose a non-consuming, server-rendered article for Telegram Instant View. Requires preview and cannot be combined with expires_in or max_views because Telegram caches articles independently.
    PreviewMetadata:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Plain-text Open Graph title; surrounding whitespace is trimmed and control or line-separator characters are rejected.
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: Plain-text Open Graph description; surrounding whitespace is trimmed and control or line-separator characters are rejected.
        image:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://"
          description: Optional absolute HTTP(S) URL exposed as og:image; surrounding whitespace is trimmed and URLs containing credentials are rejected.
        locale:
          type: string
          pattern: "^[a-z]{2,3}_[A-Z]{2}$"
          description: Optional Open Graph locale in language_TERRITORY form, such as zh_TW.
    CreateShareResponse:
      type: object
      additionalProperties: false
      required: [id, share_url, created_at, telegram_instant_view]
      properties:
        id:
          type: string
          format: uuid
        share_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
        preview:
          $ref: "#/components/schemas/PreviewMetadata"
        telegram_instant_view:
          type: boolean
    Share:
      type: object
      additionalProperties: false
      required: [content, created_at, view_count]
      properties:
        content:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
        view_count:
          type: integer
          format: int64
          minimum: 1
        views_remaining:
          type: [integer, "null"]
          format: int64
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - content_too_large
            - unauthorized
            - not_found
            - expired
            - revoked
            - view_limit_exhausted
            - internal_error
            - service_unavailable
        message:
          type: string
  responses:
    AccountError:
      description: Invalid request, authentication failure, forbidden origin or CSRF, conflict, rate limit, unavailable database, or identical not_found for missing/foreign share UUIDs. Account routes always return Cache-Control no-store. The identity marker is available only after account authorization succeeds.
      headers:
        X-Morsel-Account-ID:
          $ref: "#/components/headers/AccountIdentity"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountFailure"
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: API-key authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentTooLarge:
      description: Request or Markdown content exceeded configured limits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Share was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Share is expired, revoked, or exhausted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal dependency or processing failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: PostgreSQL is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
