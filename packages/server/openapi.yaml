    post:
      operationId: finishInvite
      summary: Complete invitation registration and create a user, first passkey, and session atomically
      description: Rechecks that the browser has no valid signed-in session. A valid session returns 409 sign_out_required without consuming the grant or overwriting the session, including when login occurs after begin. Expired/invalid cookies may proceed; database errors fail closed. Expired, used, invalid, or concurrently redeemed grants cannot create accounts and use the generic invalid_grant failure. A cancelled ceremony does not consume the grant. Clients cannot select a role.
