components:
  headers:
    NoStore:
      description: Always no-store, including failures.
      schema:
        type: string
        const: no-store
    PublicMetadataOrigin:
      description: Public metadata only, without credentials or application-wide CORS.
      schema:
        type: string
        const: "*"
    AccountIdentity:
      description: Server-derived UUID of the browser account authorized for this response. Never a request selector. Present on successful authenticated browser management and bound authentication responses; omitted for unauthenticated account state. Errors need not carry it. Compare with both expected and current identity before using private data; discard mismatches and refresh identity without replaying mutations.
      schema:
        type: string
        format: uuid
  securitySchemes:
    browserCookieAuth:
      type: apiKey
      in: cookie
      name: morsel_session
      description: Browser session for manual consent/grant routes, not OAuth/API-key Bearer access. Mutations need exact Origin and X-CSRF-Token. Approval/revocation need twelve-hour verification freshness; denial does not. Consent binds exact session/account/generation. Sessions expire after 30 days without sliding renewal.
    sessionCookie:
      type: apiKey
      in: cookie
      name: morsel_session
      description: Opaque browser session. Mutations also require exact Origin and session-bound X-CSRF-Token; sensitive changes require passkey verification within twelve hours. Sessions expire after 30 days without sliding renewal and use a persistent cookie.
    bearerAuth:
      type: http
      scheme: bearer
      description: Active account-issued API key, not OAuth. Ownership comes only from its validated account. All keys in one account have the same share permissions, never foreign ownership. Lifetime stays non-expiring until revocation, including after recovery. OAuth is accepted only at /mcp, not these REST Bearer writes.
  parameters:
    BrowserOrigin:
      name: Origin
      in: header
      required: true
      description: One exact canonical configured browser origin, never forwarded/client-selected.
      schema:
        type: string
        format: uri
    BrowserCSRF:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token bound to the current browser session.
      schema:
        type: string
        minLength: 1
    AccountItemID:
      name: id
      in: path
      required: true
      description: API key UUID or base64url passkey credential ID.
      schema:
        type: string
        minLength: 1
    ShareCapability:
      name: share
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9_-]{43}$"
  schemas:
    OAuthClientID:
      type: string
      format: uuid
      description: Public registration ID, not proof of app identity.
    OAuthResource:
      type: string
      format: uri
      maxLength: 2048
      pattern: "^https?://[^/?#]+/mcp$"
      description: Exact canonical MORSEL_URL origin plus /mcp, with no trailing slash or foreign resource.
    OAuthRedirectURI:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      description: HTTPS or HTTP localhost/127.0.0.1/[::1] callback with nonempty absolute path. No credentials, wildcard, query, fragment, escaped path, backslash. Exact match except HTTP IP-loopback port only; localhost ports match exactly. Never fetched.
    OAuthRequestedScope:
      type: string
      enum: ["mcp:shares", "mcp:shares offline_access", "offline_access mcp:shares"]
      description: Share scope required; offline_access adds refresh only. No other/duplicate/wildcard scopes.
    OAuthGrantedScope:
      type: string
      enum: ["mcp:shares", "mcp:shares offline_access"]
    OAuthResourceMetadata:
      type: object
      additionalProperties: false
      required: [resource, authorization_servers, scopes_supported, bearer_methods_supported]
      properties:
        resource:
          $ref: "#/components/schemas/OAuthResource"
        authorization_servers:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            format: uri
          description: Only the configured canonical origin issuer.
        scopes_supported:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: ["mcp:shares", offline_access]
        bearer_methods_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: header
    OAuthServerMetadata:
      type: object
      additionalProperties: false
      required: [issuer, authorization_endpoint, token_endpoint, registration_endpoint, revocation_endpoint, response_types_supported, grant_types_supported, scopes_supported, token_endpoint_auth_methods_supported, revocation_endpoint_auth_methods_supported, code_challenge_methods_supported, authorization_response_iss_parameter_supported]
      properties:
        issuer:
          type: string
          format: uri
          description: Canonical MORSEL_URL origin without trailing slash.
        authorization_endpoint:
          type: string
          format: uri
        token_endpoint:
          type: string
          format: uri
        registration_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: code
        grant_types_supported:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: [authorization_code, refresh_token]
        scopes_supported:
          type: array
          minItems: 2
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            enum: ["mcp:shares", offline_access]
        token_endpoint_auth_methods_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: none
        revocation_endpoint_auth_methods_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: none
        code_challenge_methods_supported:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: S256
        authorization_response_iss_parameter_supported:
          type: boolean
          const: true
    OAuthRegistrationRequest:
      type: object
      additionalProperties: false
      required: [client_name, redirect_uris, token_endpoint_auth_method]
      properties:
        client_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Unverified display name, trimmed to 1–200 UTF-8 bytes without NUL/CR/LF.
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: "#/components/schemas/OAuthRedirectURI"
        token_endpoint_auth_method:
          type: string
          const: none
        application_type:
          type: string
          const: native
        grant_types:
          type: array
          maxItems: 2
          uniqueItems: true
          description: If nonempty must include authorization_code. Omitted/empty uses code/refresh profile.
          items:
            type: string
            enum: [authorization_code, refresh_token]
        response_types:
          type: array
          maxItems: 1
          items:
            type: string
            const: code
        scope:
          $ref: "#/components/schemas/OAuthRequestedScope"
    OAuthRegisteredClient:
      type: object
      additionalProperties: false
      required: [client_id, client_id_issued_at, client_name, redirect_uris, grant_types, response_types, token_endpoint_auth_method, application_type, scope]
      properties:
        client_id:
          $ref: "#/components/schemas/OAuthClientID"
        client_id_issued_at:
          type: integer
          format: int64
          description: Database creation timestamp as Unix seconds.
        client_name:
          type: string
        redirect_uris:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: "#/components/schemas/OAuthRedirectURI"
        grant_types:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            enum: [authorization_code, refresh_token]
        response_types:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            const: code
        token_endpoint_auth_method:
          type: string
          const: none
        application_type:
          type: string
          const: native
        scope:
          type: string
          const: "mcp:shares offline_access"
    OAuthCodeExchange:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, code, redirect_uri, code_verifier, resource]
      properties:
        grant_type:
          type: string
          const: authorization_code
        client_id:
          $ref: "#/components/schemas/OAuthClientID"
        code:
          type: string
          pattern: "^moc_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
          description: One-use 256-bit opaque code, one-minute lifetime; never log/replay.
        redirect_uri:
          $ref: "#/components/schemas/OAuthRedirectURI"
        code_verifier:
          type: string
          minLength: 43
          maxLength: 128
          pattern: "^[A-Za-z0-9._~-]+$"
          description: S256 verifier; never stored by Morsel.
        resource:
          $ref: "#/components/schemas/OAuthResource"
        scope:
          $ref: "#/components/schemas/OAuthRequestedScope"
    OAuthRefreshExchange:
      type: object
      additionalProperties: false
      required: [grant_type, client_id, refresh_token, resource]
      properties:
        grant_type:
          type: string
          const: refresh_token
        client_id:
          $ref: "#/components/schemas/OAuthClientID"
        refresh_token:
          type: string
          pattern: "^mor_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
          description: Rotating credential; replay revokes family. Never automatically retry uncertain redemption.
        resource:
          $ref: "#/components/schemas/OAuthResource"
        scope:
          $ref: "#/components/schemas/OAuthRequestedScope"
    OAuthTokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token:
          type: string
          pattern: "^moa_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
          description: 256-bit opaque MCP-only credential; only SHA-256 signature stored.
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          format: int64
          minimum: 0
          maximum: 600
          description: Whole seconds from database time, capped by absolute family deadline.
        scope:
          $ref: "#/components/schemas/OAuthGrantedScope"
        refresh_token:
          type: string
          pattern: "^mor_[A-Za-z0-9_-]{42}[AEIMQUYcgkosw048]$"
          description: Only with offline_access, 30-day absolute family deadline from approval, not sliding. Access-only families expire ten minutes after approval.
    OAuthRevocationRequest:
      type: object
      additionalProperties: false
      required: [client_id, token]
      properties:
        client_id:
          $ref: "#/components/schemas/OAuthClientID"
        token:
          type: string
          minLength: 1
          maxLength: 2048
          description: Access/refresh credential; unknown/foreign values give the same success object.
        token_type_hint:
          type: string
          enum: [access_token, refresh_token]
    OAuthProtocolFailure:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client_metadata, invalid_redirect_uri, invalid_client, invalid_grant, invalid_scope, unsupported_grant_type, temporarily_unavailable]
          description: Safe code only, without component hints, database details, or original credentials.
    OAuthConsent:
      type: object
      additionalProperties: false
      required: [client_id, client_name, redirect_host, resource, scope, expires_at, account_id]
      properties:
        client_id:
          $ref: "#/components/schemas/OAuthClientID"
        client_name:
          type: string
          description: Unverified display text.
        redirect_host:
          type: string
          description: Validated callback authority including port if present.
        resource:
          $ref: "#/components/schemas/OAuthResource"
        scope:
          $ref: "#/components/schemas/OAuthGrantedScope"
        expires_at:
          type: string
          format: date-time
          description: Ten-minute pending-request deadline from database time.
        account_id:
          type: string
          format: uuid
          description: Displayed browser account, equal to X-Morsel-Account-ID, never an owner selector.
    OAuthConsentDecision:
      type: object
      additionalProperties: false
      required: [approve, account_id]
      properties:
        approve:
          type: boolean
        account_id:
          type: string
          format: uuid
          description: Must match displayed/request-bound and current account, never selects another account.
    OAuthConsentResult:
      type: object
      additionalProperties: false
      required: [redirect_url]
      properties:
        redirect_url:
          type: string
          format: uri
          description: Validated callback with state, iss, and code or error=access_denied. Secret code on approval; no logging, browser storage/history state, or shared navigation events.
    OAuthGrant:
      type: object
      additionalProperties: false
      required: [id, client_id, client_name, resource, scope, created_at, expires_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
          description: Owned connection/family ID, not a token.
        client_id:
          $ref: "#/components/schemas/OAuthClientID"
        client_name:
          type: string
          description: Unverified display text; identify by IDs, not names.
        resource:
          $ref: "#/components/schemas/OAuthResource"
        scope:
          $ref: "#/components/schemas/OAuthGrantedScope"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: Absolute approval-based deadline, 30 days with offline_access, ten minutes without.
        revoked_at:
          type: [string, "null"]
          format: date-time
          description: Explicit or effective older-generation revocation; null otherwise.
    AccountShareStatus:
      type: string
      description: Computed with database time; precedence is revoked, expired, view_limit_exhausted, active.
      enum: [active, revoked, expired, view_limit_exhausted]
    AccountShareMetadata:
      type: object
      required: [id, label, created_at, expires_at, max_views, view_count, revoked_at, status, link_available]
      properties:
        link_available:
          type: boolean
          description: Whether the original capability token is stored for owner retrieval. False when no plaintext token is retained; does not indicate public availability.
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 80
          description: Explicit preview title as authored plain text, or the first meaningful Markdown line converted to plain text, or Untitled. Source labels retain inline code and link labels but exclude formatting syntax, link destinations, and authored HTML. Bounded to 80 Unicode characters without changing stored source or public preview metadata.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
          minimum: 1
        view_count:
          type: integer
          format: int64
          minimum: 0
        revoked_at:
          type: [string, "null"]
          format: date-time
        status:
          $ref: "#/components/schemas/AccountShareStatus"
    AccountShareDetail:
      allOf:
        - $ref: "#/components/schemas/AccountShareMetadata"
        - type: object
          required: [content]
          properties:
            content:
              type: string
              description: Stored Markdown, including content no longer available to public readers.
    AccountSharePage:
      type: object
      additionalProperties: false
      required: [items, matching_count]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccountShareMetadata"
        matching_count:
          type: integer
          format: int64
          minimum: 0
          description: Complete number of this account's shares that match q and status before cursor filtering, including zero. Count and items use the same database snapshot and status evaluation time.
        next_cursor:
          type: string
          maxLength: 512
          description: Account-bound version 3 cursor; omitted on the last page.
    AuthenticatedResult:
      type: object
      required: [authenticated]
      properties:
        authenticated:
          type: boolean
          enum: [true]
    AccountFailure:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Account-specific error code, such as invalid_origin, invalid_csrf, invalid_flow, invalid_grant, sign_out_required, setup_closed, last_passkey, verification_required, or oauth_request_invalid. OAuth consent returns 409 oauth_request_invalid for expired, used, unseen, or account/session-mismatched requests; restart from the app. Invitation begin and finish return 409 sign_out_required for a valid signed-in browser session without consuming the grant or overwriting the session.
        message:
          type: string
    AccountState:
      type: object
      description: account_id, display_name, role, csrf_token, and verification_required are returned only when authenticated is true. Role is loaded from the database, not client input or session claims; it never grants cross-account share access. No account enumeration is provided.
      required: [setup_required, authenticated]
      properties:
        setup_required:
          type: boolean
        authenticated:
          type: boolean
        account_id:
          type: string
          format: uuid
          description: Stable authenticated account identity; never an owner request selector.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Authenticated account display name, bounded to 200 UTF-8 bytes. Need not be unique and does not authorize requests.
        role:
          type: string
          enum: [admin, user]
          description: Current database role, returned only when authenticated. Only admin can create browser invitations. Neither role can manage another account's shares.
        csrf_token:
          type: string
          description: Session-bound token, returned only to an authenticated browser.
        verification_required:
          type: boolean
          description: Returned only to an authenticated browser. True when sensitive changes need a new passkey verification; verification remains valid for twelve hours. The server rechecks it on each change.
      allOf:
        - if:
            properties:
              authenticated:
                const: true
            required: [authenticated]
          then:
            properties:
              role:
                type: string
                enum: [admin, user]
            required: [role]
          else:
            not:
              properties:
                role:
                  type: string
              required: [role]
    CreatedInvitation:
      type: object
      additionalProperties: false
      required: [invitation_url, expires_at]
      properties:
        invitation_url:
          type: string
          format: uri
          pattern: "^https?://[^/?#]+/invite#token=[A-Za-z0-9_-]{43}$"
          description: Configured-origin fragment URL returned once; a forwardable bearer secret, never a query/path token. Keep out of logs and browser storage.
        expires_at:
          type: string
          format: date-time
          description: Database-derived expiry, one hour after issuance.
    EmptyRequest:
      type: object
      additionalProperties: false
    NameRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed name limited to 200 UTF-8 bytes by the server.
    SetupFlowRequest:
      allOf:
        - $ref: "#/components/schemas/GrantFlowRequest"
      description: Setup only when no account exists; creates an admin explicitly. Optional display_name defaults to Owner; name labels the passkey. Clients cannot select a role. Setup tokens remain form-only, never in URLs.
    InviteFlowRequest:
      allOf:
        - $ref: "#/components/schemas/GrantFlowRequest"
        - type: object
          required: [display_name]
      description: A one-use admin or operator invitation always creates a user. display_name names the account; name labels its first passkey. Neither selects an existing account or role.
    GrantFlowRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: One-use grant token submitted only in this POST body. Setup and recovery tokens must never appear in URLs. Only invitation tokens may arrive in the viewer's /invite#token=<token> fragment; the viewer removes the fragment before navigation and keeps the token only in flow memory. Never put grant secrets in query parameters, paths, logs, or browser storage.
        name:
          type: string
          maxLength: 200
          description: Trimmed passkey name limited to 200 UTF-8 bytes; defaults to Passkey when omitted.
        display_name:
          type: string
          minLength: 1
          maxLength: 200
          description: Separate account display name, trimmed and bounded to 200 UTF-8 bytes. Required for invitation registration; setup defaults to Owner when omitted. Recovery retains the grant-bound account's existing name. Names need not be unique and never authorize requests.
    WebAuthnOptions:
      type: object
      required: [publicKey]
      properties:
        publicKey:
          type: object
          additionalProperties: true
          description: WebAuthn PublicKeyCredentialCreationOptionsJSON or PublicKeyCredentialRequestOptionsJSON. RP ID is hostname-only and user verification is required.
    WebAuthnCredential:
      type: object
      additionalProperties: true
      required: [id, rawId, type, response]
      properties:
        id:
          type: string
        rawId:
          type: string
        type:
          type: string
          enum: [public-key]
        response:
          type: object
          additionalProperties: true
      description: Raw browser registration or assertion JSON with base64url binary members. The server validates it with its WebAuthn library and a browser-bound flow cookie.
    APIKey:
      type: object
      required: [id, name, prefix, created_at, revoked_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: Safe display prefix; not a usable API key.
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
    CreatedAPIKey:
      allOf:
        - $ref: "#/components/schemas/APIKey"
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: Secret returned only once. Never cache or persist it in browser storage.
    Passkey:
      type: object
      required: [id, name, created_at]
      properties:
        id:
          type: string
          description: Base64url credential ID.
        name:
          type: string
        created_at:
          type: string
          format: date-time
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    CreateShareRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          description: Markdown limited by MORSEL_MAX_DOCUMENT_BYTES, measured in UTF-8 bytes.
        expires_in:
          type: integer
          format: int64
          minimum: 1
          maximum: 315360000
        max_views:
          type: integer
          format: int64
          minimum: 1
        preview:
          $ref: "#/components/schemas/PreviewMetadata"
        telegram_instant_view:
          type: boolean
          default: false
          description: Expose a non-consuming, server-rendered article for Telegram Instant View. Requires preview and cannot be combined with expires_in or max_views because Telegram caches articles independently.
    PreviewMetadata:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 80
          description: Plain-text Open Graph title; surrounding whitespace is trimmed and control or line-separator characters are rejected.
        description:
          type: string
          minLength: 1
          maxLength: 200
          description: Plain-text Open Graph description; surrounding whitespace is trimmed and control or line-separator characters are rejected.
        image:
          type: string
          format: uri
          maxLength: 2048
          pattern: "^https?://"
          description: Optional absolute HTTP(S) URL exposed as og:image; surrounding whitespace is trimmed and URLs containing credentials are rejected.
        locale:
          type: string
          pattern: "^[a-z]{2,3}_[A-Z]{2}$"
          description: Optional Open Graph locale in language_TERRITORY form, such as zh_TW.
    CreateShareResponse:
      type: object
      additionalProperties: false
      required: [id, share_url, created_at, telegram_instant_view]
      properties:
        id:
          type: string
          format: uuid
        share_url:
          type: string
          format: uri
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
        preview:
          $ref: "#/components/schemas/PreviewMetadata"
        telegram_instant_view:
          type: boolean
    Share:
      type: object
      additionalProperties: false
      required: [content, created_at, view_count]
      properties:
        content:
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        max_views:
          type: [integer, "null"]
          format: int64
        view_count:
          type: integer
          format: int64
          minimum: 1
        views_remaining:
          type: [integer, "null"]
          format: int64
          minimum: 0
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_request
            - content_too_large
            - unauthorized
            - not_found
            - expired
            - revoked
            - view_limit_exhausted
            - internal_error
            - service_unavailable
        message:
          type: string
  responses:
    OAuthProtocolError:
      description: Safe OAuth error only; no browser account marker. Invalid grant covers expired, unknown, revoked, or mismatched credentials. Storage errors fail closed with temporarily_unavailable, never reflected internal details. No-store and no-cache apply to protocol success and failure.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Pragma:
          schema:
            type: string
            const: no-cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthProtocolFailure"
    OAuthRateLimited:
      description: OAuth rate/admission limit reached. Retry-After is present for limiter rejection, not necessarily capacity rejection. No automatic retry; wait for eligible expiry/cleanup and explicitly reconnect. Cleanup is at most once/minute/process and 2000 rows/statement; grant rows remain until family expiry, active-family code/refresh tombstones until family expiry, expired access rows can be pruned.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          description: Seconds before an explicit retry is permitted; optional on capacity rejection.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthProtocolFailure"
    OAuthMethodNotAllowed:
      description: Unsupported protocol method; never viewer HTML.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Allow:
          schema:
            type: string
            enum: [GET, POST, "GET, OPTIONS"]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OAuthProtocolFailure"
    OAuthMetadataOptions:
      description: Public credential-free metadata GET/OPTIONS only.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Access-Control-Allow-Origin:
          $ref: "#/components/headers/PublicMetadataOrigin"
        Access-Control-Allow-Methods:
          schema:
            type: string
            const: "GET, OPTIONS"
    AccountError:
      description: Invalid request, authentication failure, forbidden origin or CSRF, conflict, rate limit, unavailable database, or identical not_found for missing/foreign share UUIDs. Account routes always return Cache-Control no-store. The identity marker is available only after account authorization succeeds.
      headers:
        X-Morsel-Account-ID:
          $ref: "#/components/headers/AccountIdentity"
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountFailure"
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: API-key authentication failed
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ContentTooLarge:
      description: Request or Markdown content exceeded configured limits
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Share was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Gone:
      description: Share is expired, revoked, or exhausted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Internal dependency or processing failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: PostgreSQL is unavailable
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
